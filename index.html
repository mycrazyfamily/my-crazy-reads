<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Crazy Family | Livres personnalisés pour enfants</title>
    <meta name="description" content="Créez des livres personnalisés uniques et magiques où votre enfant et toute sa famille deviennent les véritables héros de l'histoire." />
    <meta name="author" content="My Crazy Family" />
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- Préchargement de l'image du hero de l'accueil.
         Le navigateur la télécharge dès la lecture du <head>, sans attendre que React soit chargé,
         monté et arrivé jusqu'au composant NewHero — ce qui supprime l'essentiel du délai avant le
         premier affichage. Ce fichier index.html étant partagé par toutes les routes, l'image est
         aussi préchargée sur les pages qui ne l'affichent pas : c'est acceptable parce qu'elle ne
         pèse que 172 Ko (elle en faisait 2 182 en PNG, où ce préchargement aurait été néfaste).
         Si le nom du fichier change, cette ligne doit être mise à jour en même temps que NewHero. -->
    <link rel="preload" as="image" href="/lovable-uploads/hero-famille.webp" fetchpriority="high" />

    <meta property="og:title" content="My Crazy Family | Livres personnalisés pour enfants" />
    <meta property="og:description" content="Créez des livres personnalisés uniques et magiques où votre enfant et toute sa famille deviennent les véritables héros de l'histoire." />
    <meta property="og:type" content="website" />
    <!-- Image de partage My Crazy Family (01/10/2026), 1200 x 630, fichier public/og-image.png -->
    <meta property="og:image" content="https://www.mycrazyfamily.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="My Crazy Family : chaque mois, un livre dont votre enfant est le héros" />
    <meta property="og:url" content="https://www.mycrazyfamily.com/" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.mycrazyfamily.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <div id="portal-root"></div>
    <div id="datepicker-portal"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
